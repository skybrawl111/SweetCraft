{% extends 'base.html' %}

{% block title %}Редактирование отзыва — Кондитерская «SweetCraft»{% endblock %}

{% block content %}
  <div style="max-width: 540px; margin: 40px auto; background: var(--bg-card); padding: 32px; border-radius: var(--radius-md); border: 1px solid var(--border-color); box-shadow: var(--shadow-sm);">
    <h1 style="font-size: 22px; font-weight: 800; margin-bottom: 8px;">Редактирование отзыва (п. 5)</h1>
    <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;">
      Торт: <strong>«{{ review.base_cake.title }}»</strong>
    </p>

    <form method="post">
      {% csrf_token %}
      <div style="margin-bottom: 16px;">
        <label class="filter-title">Оценка:</label>
        {{ form.rating }}
      </div>

      <div style="margin-bottom: 20px;">
        <label class="filter-title">Текст отзыва:</label>
        {{ form.text }}
      </div>

      <div style="display:flex; gap:12px;">
        <button type="submit" class="btn btn-primary">Сохранить изменения</button>
        <a href="{% url 'cake_detail' review.base_cake.slug %}" class="btn btn-secondary">Отмена</a>
      </div>
    </form>
  </div>
{% endblock %}
