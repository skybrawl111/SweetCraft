{% extends 'base.html' %}

{% block title %}Редактирование отзыва — Кондитерская «SweetCraft»{% endblock %}

{% block content %}
  <div class="auth-card-wrap">
    <div class="auth-card auth-card-wide">
      <h1 class="auth-card-title">Редактирование отзыва</h1>
      <p class="auth-card-subtitle">
        Торт: <strong>«{{ review.base_cake.title }}»</strong>
      </p>

      <form method="post" class="validated-form" data-validate="true">
        {% csrf_token %}
        
        <div class="form-group rating-form-group">
          <label class="form-label">Оценка (1–5 звезд):</label>
          {{ form.rating }}
        </div>

        <div class="form-group">
          <label class="form-label">Текст отзыва:</label>
          {{ form.text }}
          <div class="client-error-msg"></div>
        </div>

        <div class="card-btn-group">
          <button type="submit" class="btn btn-primary">Сохранить изменения</button>
          <a href="{% url 'cake_detail' review.base_cake.slug %}" class="btn btn-secondary">Отмена</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
